shell_integration enabled
startup_session none
# 依然推荐保留 shell 集成，因为它能让 Kitty 更强大（例如跳转到上一个提示符）

mouse_hide_wait                              1.0

# vim:fileencoding=utf-8:foldmethod=marker
# 下划线
modify_font underline_position               3
modify_font underline_thickness              50%
modify_font strikethrough_position           2px

# 用系统快捷键关闭窗口时不再提醒
confirm_os_window_close                      0
# 关闭窗口时同时关闭子进程
close_on_child_death                         yes

# 窗口样式
# 窗口边框
# hide_window_decorations                    titlebar-only\titlebar-and-corners\yes\no
hide_window_decorations                      titlebar-and-corners
# 全屏用传统模式（不新建 Space），否则原生全屏背后是黑底，背景透明度会失效
macos_traditional_fullscreen                 yes
remember_window_size                         yes
# 窗口边距
window_padding_width                         0 10 0 10
# 开启垂直方向分屏和全屏模式
enabled_layouts                              fat:bias=50,tall:bias=50,stack

# 背景
background_blur                              0
# 背景透明度
# background_opacity                           0
background_opacity                           0.8

# 光标颜色使用当前文本颜色
cursor                                       none
cursor_trail                                 1
# 当移动1个字符位置时也使用动效，这样看着更平滑
cursor_trail_decay                           0.1 0.4
cursor_trail_start_threshold                 0
cursor_blink_interval                        0.5 ease-in-out

# bar tab
# Tab bar 边线样式
tab_powerline_style                          angled
# Tab bar 样式                                fade\slant\separator\powerline\custom
tab_bar_style                                fade
tab_fade                                     0.5 1
# Tab bar 位置
tab_bar_edge                                 top
# 标签标题模板
tab_title_template                           "{title}"
active_tab_title_template                    "{title}"
# 标签分隔符
tab_separator                                ">>>"
# 标签栏边距
tab_bar_margin_width                         80.0
tab_bar_margin_height                        0.0 0.0
# 标签栏颜色 (已注释，使用 Catppuccin Mocha 主题颜色)
tab_bar_margin_color                         #333333
