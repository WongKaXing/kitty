# 字体
# font_family                                  Fira Code Regular
# bold_font                                    Fira Code Medium

# italic_font                                  VictorMono Nerd Font Mono Thin Italic
# bold_italic_font                             VictorMono Nerd Font Mono Bold Italic

# italic_font                                  JetBrainsMono Nerd Font Mono Thin Italic
# bold_italic_font                             JetBrainsMono Nerd Font Mono Bold Italic
font_size                                    20
font_family                                  VictorMono Nerd Font Mono Light
bold_font                                    VictorMono Nerd Font Mono SemiBold
italic_font                                  VictorMono Nerd Font Mono Light Italic
bold_italic_font                             VictorMono Nerd Font Mono SemiBold Italic
symbol_map                                   U+4E00-U+9fA5,U+9FA6-U+9FCB       LXGW WenKai Regular


# vim:fileencoding=utf-8:foldmethod=marker
# 下划线
modify_font underline_position               3
modify_font underline_thickness              50%
modify_font strikethrough_position           2px

# 字体宽度及高度调整
modify_font cell_width +1px
modify_font cell_height +6px

# nvim copy mode
scrollback_pager sh -c 'NVIM_MODE="kitty-copy" nvim 63<&0 </dev/null -i NONE -c "au VimEnter * term cat /dev/fd/63 && sleep 100"'
map cmd+i show scrollback

