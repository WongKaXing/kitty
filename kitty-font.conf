# 字体
# 注意：所有字体（含斜体）都必须用 "Nerd Font Mono" 变体 —— kitty 只接受 CoreText 标记为等宽的字体，
# 非 Mono 的 "VictorMono Nerd Font" / "JetBrainsMono Nerd Font" 会被判为非等宽并回退到 Menlo。
font_size                                    20
# font_family                                  Fira Code Regular
# bold_font                                    Fira Code Medium
font_family                                  VictorMono Nerd Font Mono Light
bold_font                                    VictorMono Nerd Font Mono SemiBold
# 斜体混用 JetBrains Mono（实测 kitty 不会缩放字体，同字号 x-height 与正文一致；Thin 字重看着偏细）
italic_font                                  JetBrainsMono Nerd Font Mono Thin Italic
bold_italic_font                             JetBrainsMono Nerd Font Mono Bold Italic
symbol_map                                   U+4E00-U+9fA5,U+9FA6-U+9FCB       LXGW WenKai Regular
