# 字体
# 注意：主字体必须是 "Nerd Font Mono" 变体 —— kitty 只接受 CoreText 标记为等宽的字体，
# 普通的 "VictorMono Nerd Font"（非 Mono）会被判为非等宽并回退到 Menlo。
font_size                                    20
# font_family                                  Fira Code Regular
# bold_font                                    Fira Code Medium
font_family                                  VictorMono Nerd Font Mono Light
bold_font                                    VictorMono Nerd Font Mono SemiBold
italic_font                                  JetBrainsMono Nerd Font Thin Italic
bold_italic_font                             JetBrainsMono Nerd Font Bold Italic
symbol_map                                   U+4E00-U+9fA5,U+9FA6-U+9FCB       LXGW WenKai Regular
